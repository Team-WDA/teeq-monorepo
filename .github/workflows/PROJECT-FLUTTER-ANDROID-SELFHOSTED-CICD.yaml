# project-auto-wizard:managed-workflow
# ===================================================================
# Flutter Android 자체 서버(SMB) 배포 워크플로우
# ===================================================================
#
# main 브랜치 푸시 시 Android APK를 빌드하고
# 자체 서버(예: Synology NAS·NAS·Linux)의 SMB 공유에 APK를 배포합니다.
#
# ===================================================================
# 🔑 필수 GitHub Secrets
# ===================================================================
# ENV_FILE 또는 ENV: .env 파일 내용 (둘 중 하나, ENV_FILE 우선)
# RELEASE_KEYSTORE_BASE64: 서명용 keystore (base64)
# RELEASE_KEYSTORE_PASSWORD: keystore 비밀번호
# RELEASE_KEY_ALIAS: key alias
# RELEASE_KEY_PASSWORD: key 비밀번호
# GOOGLE_SERVICES_JSON (선택): Firebase google-services.json
# SERVER_HOST: 서버 호스트(SMB 접속 주소)
# SERVER_USER: SMB 사용자명
# SERVER_PASSWORD: SMB 비밀번호
# ===================================================================

name: PROJECT-Android-SelfHosted-CICD

on:
  push:
    branches: ["main"]
    paths: ["frontend/**"]  # [ai-friend]
  workflow_dispatch: # 수동 실행 옵션 추가

# ============================================
# 🔧 프로젝트별 설정 (아래 값들을 수정하세요)
# ============================================
env:
  # 프로젝트 이름 (APK 파일명, 아티팩트명, 히스토리 파일명에 사용)
  APP_ARTIFACT_NAME: "ai-friend"  # [ai-friend]
  FLUTTER_VERSION: "3.47.5"  # [ai-friend]
  JAVA_VERSION: "21"
  # SMB 서버 설정 (자체 서버 — Synology NAS·Linux 등)
  SMB_PORT: "44445" # 기본 445
  SMB_SHARE: "web"
  SMB_PATH_IOS: "/your-project/ios/download" # SMB 경로: /{APP_ARTIFACT_NAME}/ios/download 형식으로 사용
  SMB_PATH_ANDROID: "/android/download"  # [ai-friend: wizard 원본에 정의가 빠져 있었음]
jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # CHANGELOG 워크플로우가 성공한 경우에만 실행
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    defaults:
      run:
        working-directory: frontend  # [ai-friend]

    steps:
      # Repository 체크아웃 및 목록 출력
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List repository contents
        run: |
          echo "Repository checked out"
          ls -la

      # [ai-friend: 빈 시크릿이면 0바이트 keystore로 덮어쓰지 않도록 가드 (디버깅 용도)]
      - name: Setup Debug Keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Debug Keystore created (for debugging)"
            keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android || echo "Keytool failed"
          else
            echo "::warning::DEBUG_KEYSTORE not set; skipping (Gradle default debug keystore will be used)"
          fi

      # [ai-friend: disabled - 앱은 .env를 읽지 않음]
      # - name: Create .env file from GitHub Secret
      #   env:
      #     ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
      #   run: |
      #     printf '%s\n' "$ENV_CONTENT" > .env
      #     echo ".env file created"
      #     ls -la

      # [ai-friend: FRONTEND_CONFIG_JSON secret -> frontend/config/prod.json]
      - name: Create config/prod.json
        env:
          FRONTEND_CONFIG_JSON: ${{ secrets.FRONTEND_CONFIG_JSON }}
        run: |
          mkdir -p config
          if [ -z "$FRONTEND_CONFIG_JSON" ]; then
            echo "::error::FRONTEND_CONFIG_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$FRONTEND_CONFIG_JSON" > config/prod.json
          python3 -m json.tool config/prod.json > /dev/null

      # [ai-friend: 빈 시크릿이면 0바이트 keystore/key.properties로 덮어쓰지 않도록 가드. 없으면 build.gradle.kts가 debug 서명으로 폴백]
      - name: Setup Keystore and key.properties
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p android/app/keystore
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > android/app/keystore/key.jks
            echo "storeFile=app/keystore/key.jks" > android/key.properties
            echo "storePassword=android" >> android/key.properties
            echo "keyAlias=androiddebugkey" >> android/key.properties
            echo "keyPassword=android" >> android/key.properties
            echo "key.properties created"
          else
            echo "::warning::DEBUG_KEYSTORE not set; skipping (Gradle default debug signing will be used)"
          fi

      # [ai-friend: disabled - google-services 플러그인을 쓰지 않아 아무도 이 파일을 읽지 않음]
      # - name: Create Google-services.json
      #   run: |
      #     cat << 'EOF' > android/app/google-services.json
      #     ${{ secrets.GOOGLE_SERVICES_JSON }}
      #     EOF
      #     echo "✅ Google-services.json 생성 완료"
      #     ls -la android/app/

      # Flutter 설정 및 버전 확인
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Verify Flutter version
        run: |
          echo "Flutter setup completed"
          flutter --version

      # Flutter 및 Gradle 캐시
      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 프로젝트 의존성 설치
      - name: Install dependencies
        run: |
          flutter pub get
          dart run build_runner build
          echo "Dependencies installed"

      # [ai-friend: disabled - frontend/android/.gitignore가 gradlew를 무시함. flutter build가 wrapper를 재생성한다]
      # - name: Setup Gradle
      #   working-directory: android
      #   run: |
      #     chmod +x gradlew
      #     echo "Gradle wrapper permissions set"

      # Java 설정 및 버전 확인
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Java version
        run: |
          echo "Java setup completed"
          java -version

      # [ai-friend: disabled - SELFHOSTED는 fastlane 없이 flutter build로 직접 빌드함(스토어 배포가 아님)]
      # - name: Set up Ruby
      #   uses: ruby/setup-ruby@v1
      #   with:
      #     ruby-version: "3.4.1"
      #
      # - name: Verify Ruby version
      #   run: |
      #     echo "Ruby setup completed"
      #     ruby -v
      #
      # - name: Install Fastlane
      #   working-directory: android
      #   run: |
      #     printf 'source "https://rubygems.org"\ngem "fastlane"\ngem "multi_json"\n' > Gemfile
      #     bundle install
      #     echo "Fastlane installed (Bundler)"
      #     bundle exec fastlane --version

      # 현재 버전 정보 및 짧은 커밋 해시 계산
      - name: Get version info and calculate short commit hash
        id: version_info
        run: |
          CURRENT_VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION=$(echo $CURRENT_VERSION | cut -d'+' -f1)
          BUILD_NUMBER=$(echo $CURRENT_VERSION | cut -d'+' -f2)
          SHORT_COMMIT_HASH=$(echo ${{ github.sha }} | cut -c1-7)

          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "SHORT_COMMIT_HASH=$SHORT_COMMIT_HASH" >> $GITHUB_ENV

          echo "현재 버전: $CURRENT_VERSION"
          echo "짧은 커밋 해시: $SHORT_COMMIT_HASH"

      # [ai-friend: Q30 - fastlane 대신 직접 빌드]
      - name: Build APK
        run: |
          flutter build apk --release --dart-define-from-file=config/prod.json
          ls -la build/app/outputs/flutter-apk/ || true

      # APK 파일 이름 변경 및 준비
      - name: Rename and Prepare APK
        run: |
          mkdir -p ./android/app/build/outputs/apk/release/
          mv ./build/app/outputs/flutter-apk/app-release.apk ./android/app/build/outputs/apk/release/${{ env.APP_ARTIFACT_NAME }}-v${{ env.VERSION }}-${{ env.SHORT_COMMIT_HASH }}.apk
          echo "APK renamed to ${{ env.APP_ARTIFACT_NAME }}-v${{ env.VERSION }}-${{ env.SHORT_COMMIT_HASH }}.apk"
          ls -la ./android/app/build/outputs/apk/release/

      # APK를 아티팩트로 업로드
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_ARTIFACT_NAME }}-apk
          path: ./frontend/android/app/build/outputs/apk/release/${{ env.APP_ARTIFACT_NAME }}-v${{ env.VERSION }}-${{ env.SHORT_COMMIT_HASH }}.apk  # [ai-friend: uses: 스텝은 defaults 미적용]
          retention-days: 1

  deploy-android:
    name: Deploy Android APK
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: List repository contents for deploy
        run: |
          echo "Repository checked out for deploy"
          ls -la

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y smbclient jq
          echo "SMB and jq dependencies installed"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_ARTIFACT_NAME }}-apk
          path: android/app/build/outputs/

      - name: List downloaded structure (Debug)
        run: |
          ls -alR android/app/build/outputs
          echo "Downloaded structure listed"

      - name: Find APK file
        run: |
          APK_FILE=$(find android/app/build/outputs/ -name "*.apk" | head -n 1)
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          APK_NAME=$(basename "$APK_FILE")
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "APK file found: $APK_FILE"

      - name: Upload files to server via SMB
        env:
          SMB_USERNAME: ${{ secrets.SERVER_USER }}
          SMB_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          SMB_SERVER=${{ secrets.SERVER_HOST }}
          SMB_PORT=${{ env.SMB_PORT }}
          SMB_SHARE=${{ env.SMB_SHARE }}
          SMB_PATH="/${{ env.APP_ARTIFACT_NAME }}${{ env.SMB_PATH_ANDROID }}"
          echo "Uploading APK file ${{ env.APK_NAME }} to SMB..."
          echo "SMB Path: $SMB_PATH"
          smbclient "//$SMB_SERVER/$SMB_SHARE" -p "$SMB_PORT" -U "$SMB_USERNAME%$SMB_PASSWORD" -m SMB3 -d 10 -c "mkdir $SMB_PATH; cd $SMB_PATH; put ${{ env.APK_FILE }} ${{ env.APK_NAME }}"
          echo "APK uploaded to SMB"

      - name: Update CICD history JSON
        env:
          SMB_USERNAME: ${{ secrets.SERVER_USER }}
          SMB_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          export TZ='Asia/Seoul'
          BUILD_DATE=$(date +"%Y-%m-%d %H:%M")
          FILE_SIZE=$(stat -c%s "${{ env.APK_FILE }}")
          COMMIT_LINK="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          FULL_COMMIT_HASH="${{ github.sha }}"
          HISTORY_FILE="${{ env.APP_ARTIFACT_NAME }}-android-cicd-history.json"

          NEW_BUILD_INFO=$(jq -n \
            --arg apk_name "${{ env.APK_NAME }}" \
            --arg file_size "$FILE_SIZE" \
            --arg build_date "$BUILD_DATE" \
            --arg commit_link "$COMMIT_LINK" \
            --arg full_commit_hash "$FULL_COMMIT_HASH" \
            '{apk_name: $apk_name, file_size: $file_size, build_date: $build_date, commit_link: $commit_link, full_commit_hash: $full_commit_hash}')

          SMB_SERVER=${{ secrets.SERVER_HOST }}
          SMB_PORT=${{ env.SMB_PORT }}
          SMB_SHARE=${{ env.SMB_SHARE }}
          SMB_PATH="/${{ env.APP_ARTIFACT_NAME }}${{ env.SMB_PATH_ANDROID }}"

          smbclient "//$SMB_SERVER/$SMB_SHARE" -p "$SMB_PORT" -U "$SMB_USERNAME%$SMB_PASSWORD" -m SMB3 -d 10 -c "cd $SMB_PATH; get $HISTORY_FILE" || echo '{"files": []}' > $HISTORY_FILE
          echo "Downloaded or initialized $HISTORY_FILE"
          cat $HISTORY_FILE

          jq --argjson new_build "$NEW_BUILD_INFO" '.files += [$new_build]' $HISTORY_FILE > updated.json
          echo "Updated $HISTORY_FILE with new build info"
          cat updated.json

          smbclient "//$SMB_SERVER/$SMB_SHARE" -p "$SMB_PORT" -U "$SMB_USERNAME%$SMB_PASSWORD" -m SMB3 -d 10 -c "cd $SMB_PATH; put updated.json $HISTORY_FILE"
          echo "Updated $HISTORY_FILE uploaded to SMB"
