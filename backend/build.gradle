plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.co.teeq.api'
version = '0.39.0'
description = 'TeeQ backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'chuseok22NexusReleases'
        url = uri('https://nexus.chuseok22.com/repository/maven-releases/')
    }
}

dependencyManagement {
    imports {
        mavenBom 'software.amazon.awssdk:bom:2.57.1'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    implementation('software.amazon.awssdk:s3') {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'org.flywaydb:flyway-database-postgresql'
    // 컨트롤러 메서드 요청·응답 로깅(@LogMonitoring)
    implementation 'com.chuseok22:logging:0.0.9'
    // 인증 검증에 쓰지 않는 Firestore SDK는 제외한다. Storage는 FirebaseAuth 로딩에 필요한 gax 클래스를 함께 가져와 제외하지 않는다
    implementation('com.google.firebase:firebase-admin:9.11.0') {
        exclude group: 'com.google.cloud', module: 'google-cloud-firestore'
    }
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.tngtech.archunit:archunit-junit6:1.5.0'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// [teeq] 플레인 jar(archunit 등과 무관한 부산물) 생성을 꺼서 build/libs/ 에 bootJar 하나만
// 남게 한다. Dockerfile의 COPY build/libs/*.jar 가 파일 두 개(app.jar, app-plain.jar)를
// 만나 실패하는 것을 방지한다.
tasks.named('jar') {
    enabled = false
}
