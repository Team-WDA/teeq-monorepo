# 공통 설정(git 추적). 시크릿 값은 넣지 않는다.
#
# 프로필별 실제 값은 gitignore 된 파일에 둔다. (example 파일 없음)
#   - application-dev.yml  : 로컬 접속 정보
#   - application-prod.yml : 운영 값 (wizard 워크플로우가 secret APPLICATION_PROD_YML 로 생성)
#
# 프로필 파일에 필요한 키:
#   - spring.datasource.url
#   - spring.datasource.username
#   - spring.datasource.password
spring:
  application:
    name: ai-friend-backend
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
