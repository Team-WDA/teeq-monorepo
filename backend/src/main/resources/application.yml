spring:
  profiles:
    active: prod
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: true
        use_sql_comments: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      enabled: true # 파일 업로드 허용
      max-file-size: 200MB # 업로드 파일 최대 크기
      max-request-size: 1000MB # 요청 전체 최대 크기
      file-size-threshold: 10MB
  mvc:
    format:
      date-time: "yyyy-MM-dd'T'HH:mm:ss"

springdoc:
  servers:
    - url: https://api.teeq.co.kr
      description: main-server
    - url: http://localhost:8080
      description: local-server

  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: /docs/swagger

firebase:
  service-account-location: classpath:firebase-service-account.json

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: lax # 관리자 세션 쿠키. HttpOnly는 Tomcat 기본값

# 컨트롤러 메서드 로깅(@LogMonitoring) 설정. 시크릿 값도 마스킹 없이 출력한다(프로젝트 결정)
chuseok22:
  logging:
    enabled: true
    mask-sensitive: false

