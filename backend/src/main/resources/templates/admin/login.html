<!doctype html>
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>teeq 관리자 로그인</title>
  <link rel="stylesheet" th:href="@{/admin/assets/daisyui.min.css}">
  <link rel="stylesheet" th:href="@{/admin/assets/themes.css}">
  <link rel="stylesheet" th:href="@{/admin/assets/admin.css}">
</head>
<body>
  <main class="login-split">
    <section class="login-brand-panel" aria-label="서비스 소개">
      <div>
        <div class="brand">teeq <span class="brand-accent">admin</span></div>
        <p class="tagline">서비스 설정, 통화 사용량, 통화 보너스, 온보딩 응답 이력을 관리합니다.</p>
      </div>
      <p class="footnote">운영자 전용 화면입니다.</p>
    </section>

    <section class="login-form-panel">
      <form class="login-form" method="post" th:action="@{/admin/login}">
        <h1>관리자 로그인</h1>
        <p class="subtitle">관리자 계정으로 로그인합니다.</p>

        <!-- 아이디 없음과 비밀번호 불일치를 구분하지 않는 고정 문구 -->
        <div th:if="${param.error}" class="login-message error" role="alert">아이디 또는 비밀번호가 올바르지 않습니다.</div>
        <div th:if="${param.logout}" class="login-message info" role="status">로그아웃되었습니다.</div>

        <label class="field">
          <span class="field-label">아이디</span>
          <input class="input input-bordered" type="text" name="username" autocomplete="username" required autofocus>
        </label>
        <label class="field">
          <span class="field-label">비밀번호</span>
          <input class="input input-bordered" type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary" type="submit">로그인</button>
      </form>
    </section>
  </main>
</body>
</html>
