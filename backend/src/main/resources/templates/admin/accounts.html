<!doctype html>
<html lang="ko" th:replace="~{admin/fragments/shell :: shell('관리자 계정', ~{::main}, 'accounts')}" xmlns:th="http://www.thymeleaf.org">
<body>
<main class="content">
  <div class="page-head">
    <div>
      <h1>관리자 계정</h1>
      <p>관리자 계정을 만들고 권한을 바꾸거나 비활성화합니다. 본인 계정은 여기서 바꿀 수 없습니다. 시각은 한국 시간 기준입니다.</p>
    </div>
  </div>

  <ul class="account-form-errors" role="alert" th:if="${formErrorMessages != null}">
    <li th:each="formErrorMessage : ${formErrorMessages}" th:text="${formErrorMessage}">입력값이 올바르지 않습니다.</li>
  </ul>

  <section th:replace="~{admin/fragments/admin-account-create-form :: admin-account-create-form}"></section>
  <section th:replace="~{admin/fragments/admin-account-table :: admin-account-table}"></section>
</main>
</body>
</html>
