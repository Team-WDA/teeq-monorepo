<!doctype html>
<html lang="ko" th:replace="~{admin/fragments/shell :: shell('서비스 설정', ~{::main}, 'settings')}" xmlns:th="http://www.thymeleaf.org">
<body>
<main class="content">
  <div class="page-head">
    <div>
      <h1>서비스 설정</h1>
    </div>
  </div>

  <nav th:replace="~{admin/fragments/tab-navigation :: tab-navigation(${settingTabs}, ${activeTab})}"></nav>

  <section class="panel">
    <div class="table-wrap">
      <table class="table setting-table">
        <thead>
          <tr>
            <th>설정</th>
            <th>값</th>
            <th>상태</th>
          </tr>
        </thead>
        <tbody>
          <th:block th:each="setting : ${settings}">
            <tr th:replace="~{admin/fragments/setting-row :: setting-row}"></tr>
          </th:block>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
