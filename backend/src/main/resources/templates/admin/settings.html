<!doctype html>
<html lang="ko" th:replace="~{admin/fragments/shell :: shell('서비스 설정', ~{::main}, 'settings')}" xmlns:th="http://www.thymeleaf.org">
<body>
<main class="content">
  <div class="page-head">
    <div>
      <h1>서비스 설정</h1>
      <p>키마다 따로 저장합니다. 운영 중 바꿀 수 있는 정책 값만 보입니다.</p>
    </div>
  </div>

  <p class="notice notice-info" role="status">저장하면 즉시 반영됩니다. 서버를 다시 시작할 필요가 없습니다.</p>

  <section class="panel">
    <div class="table-wrap">
      <table class="table setting-table">
        <thead>
          <tr>
            <th>설정</th>
            <th>값</th>
            <th>상태</th>
          </tr>
        </thead>
        <tbody>
          <th:block th:each="setting : ${settings}">
            <tr th:replace="~{admin/fragments/setting-row :: setting-row}"></tr>
          </th:block>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
