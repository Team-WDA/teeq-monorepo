<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 회원 목록 필터(GET 폼, 값은 쿼리스트링에 남는다). 컨텍스트 변수 keyword, loginType, loginTypes -->
<section class="panel" th:fragment="member-filter-form">
  <form class="panel-body member-filter-form" method="get" th:action="@{/admin/members}">
    <label class="member-filter-field member-filter-keyword">
      <span class="member-filter-label">이메일 또는 닉네임</span>
      <input class="input input-sm" type="text" name="keyword" th:value="${keyword}" placeholder="비우면 전체 회원">
    </label>
    <label class="member-filter-field">
      <span class="member-filter-label">로그인 방식</span>
      <select class="select select-sm" name="loginType">
        <option value="" th:selected="${loginType == null}">전체</option>
        <option th:each="type : ${loginTypes}" th:value="${type.name()}" th:text="${type.name()}"
                th:selected="${loginType != null and loginType == type}">APPLE</option>
      </select>
    </label>
    <button class="btn btn-sm btn-primary" type="submit">조회</button>
  </form>
</section>
</body>
</html>
