<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 통화 사용량 필터(GET 폼, 값은 쿼리스트링에 남는다). 컨텍스트 변수 unit, from, to, memberId -->
<section class="panel" th:fragment="call-usage-filter-form">
  <form class="panel-body call-usage-filter-form" method="get" th:action="@{/admin/call-usages}">
    <label class="call-usage-filter-field">
      <span class="call-usage-filter-label">집계 단위</span>
      <select class="select select-sm" name="unit">
        <option value="DAY" th:selected="${unit.name() == 'DAY'}">일별</option>
        <option value="MONTH" th:selected="${unit.name() == 'MONTH'}">월별</option>
      </select>
    </label>
    <label class="call-usage-filter-field">
      <span class="call-usage-filter-label">시작일</span>
      <input class="input input-sm" type="date" name="from" th:value="${from}">
    </label>
    <label class="call-usage-filter-field">
      <span class="call-usage-filter-label">종료일</span>
      <input class="input input-sm" type="date" name="to" th:value="${to}">
    </label>
    <label class="call-usage-filter-field call-usage-filter-member">
      <span class="call-usage-filter-label">회원 ID (선택)</span>
      <input class="input input-sm mono" type="text" name="memberId" th:value="${memberId}" placeholder="비우면 전체 회원">
    </label>
    <button class="btn btn-sm btn-primary" type="submit">조회</button>
  </form>
</section>
</body>
</html>
