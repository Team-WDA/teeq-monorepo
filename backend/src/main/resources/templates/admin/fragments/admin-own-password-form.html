<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  본인 비밀번호 변경 폼(일반 POST, CSRF 숨은 필드는 th:action이 넣는다).
  formErrorMessages: 입력 검증 실패 문구 목록(없으면 null). 입력한 비밀번호는 다시 싣지 않는다
-->
<section class="panel" th:fragment="admin-own-password-form">
  <div class="panel-head"><h2>내 비밀번호</h2></div>
  <form class="panel-body account-password-form" method="post" th:action="@{/admin/password}">
    <ul class="account-form-errors" role="alert" th:if="${formErrorMessages != null}">
      <li th:each="formErrorMessage : ${formErrorMessages}" th:text="${formErrorMessage}">입력값이 올바르지 않습니다.</li>
    </ul>
    <label class="account-field">
      <span class="account-label">현재 비밀번호</span>
      <input class="input input-sm" type="password" name="currentPassword" autocomplete="current-password" required>
    </label>
    <label class="account-field">
      <span class="account-label">새 비밀번호</span>
      <input class="input input-sm" type="password" name="newPassword" autocomplete="new-password" required>
    </label>
    <label class="account-field">
      <span class="account-label">새 비밀번호 확인</span>
      <input class="input input-sm" type="password" name="newPasswordConfirm" autocomplete="new-password" required>
    </label>
    <button class="btn btn-sm btn-primary" type="submit">변경</button>
  </form>
</section>
</body>
</html>
