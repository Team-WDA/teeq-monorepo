<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 최근 가입 회원 5명. 이메일은 앞 1자만 보인다. 컨텍스트 변수 dashboard -->
<section class="panel" th:fragment="dashboard-recent-members">
  <div class="panel-head">
    <h2>최근 가입</h2>
  </div>
  <div class="table-wrap">
    <table class="table table-sm">
      <thead>
        <tr>
          <th>이메일</th>
          <th>가입 시각</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="member : ${dashboard.recentMembers}">
          <td th:text="${member.maskedEmail}">m***@example.com</td>
          <td class="muted" th:text="${#temporals.format(member.joinedAt, 'yyyy-MM-dd HH:mm:ss', 'Asia/Seoul')}">-</td>
        </tr>
        <tr th:if="${#lists.isEmpty(dashboard.recentMembers)}">
          <td class="muted" colspan="2">아직 가입한 회원이 없습니다.</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
</body>
</html>
