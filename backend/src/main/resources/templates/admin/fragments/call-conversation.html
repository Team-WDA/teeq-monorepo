<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 통화 대화 영역. detail.conversationState(LOADED, RESULT_PENDING, RESULT_MISSING, EMPTY, NOT_RECORDED, UNAVAILABLE)별로 보여 준다. 대화 텍스트는 th:text로만 출력한다 -->
<section class="panel" th:fragment="call-conversation" th:switch="${detail.conversationState.name()}">
  <div class="panel-head"><h2>대화</h2></div>

  <div th:case="'LOADED'" class="panel-body">
    <p class="call-conversation-summary" th:if="${detail.aiDetail.summary != null}">
      <span class="call-conversation-summary-label">요약</span>
      <span th:text="${detail.aiDetail.summary}">통화 요약</span>
    </p>
    <ol class="call-conversation-list">
      <li th:each="turn : ${detail.aiDetail.turns}"
          th:classappend="${turn.role.name() == 'USER'} ? 'call-bubble-user' : 'call-bubble-assistant'"
          class="call-bubble">
        <span class="call-bubble-role" th:text="${turn.role.name() == 'USER'} ? '사용자' : 'AI'">사용자</span>
        <p class="call-bubble-text" th:text="${turn.text}">대화 내용</p>
        <span class="badge badge-ghost badge-sm" th:if="${turn.interrupted}">끼어듦</span>
      </li>
    </ol>
  </div>

  <p th:case="'RESULT_PENDING'" class="panel-body muted">통화 결과를 아직 받지 못했습니다.</p>

  <p th:case="'RESULT_MISSING'" class="panel-body muted">통화 결과가 수신되지 않았습니다.</p>

  <p th:case="'EMPTY'" class="panel-body muted">대화 내용이 없습니다. 발화가 없었거나 보관 기간이 지났을 수 있습니다.</p>

  <p th:case="'NOT_RECORDED'" class="panel-body muted">AI 서버에 기록이 없습니다.</p>

  <div th:case="'UNAVAILABLE'" class="panel-body">
    <p class="error-message">대화를 불러오지 못했습니다.</p>
    <a class="btn btn-sm btn-ghost" th:href="@{/admin/calls/{callSessionId}(callSessionId=${detail.call.callSessionId})}">다시 시도</a>
  </div>
</section>
</body>
</html>
