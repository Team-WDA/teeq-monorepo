<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 회원의 추가 통화 시간 부여 이력 표(서비스가 돌려준 순서 그대로). 컨텍스트 변수 bonuses, member -->
<section class="panel" th:fragment="call-bonus-table">
  <div class="table-wrap">
    <table class="table call-bonus-table">
      <thead>
        <tr>
          <th>유효 날짜</th>
          <th class="numeric-cell">추가 시간(초)</th>
          <th>사유</th>
          <th>부여 시각</th>
          <th>상태</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="bonus : ${bonuses}">
          <td th:text="${bonus.bonusDate}">2026-10-20</td>
          <td class="numeric-cell" th:text="${#numbers.formatInteger(bonus.seconds, 1, 'COMMA')}">600</td>
          <td class="call-bonus-reason-cell" th:text="${bonus.reason}">서비스 장애 보상</td>
          <td class="mono" th:text="${#temporals.format(bonus.createdAt, 'yyyy-MM-dd HH:mm:ss', 'Asia/Seoul')}">2026-10-20 12:00:00</td>
          <td>
            <form th:unless="${bonus.canceled}" method="post"
                  th:action="@{/admin/members/{memberId}/call-bonuses/{callBonusId}/cancel(memberId=${member.id},callBonusId=${bonus.id})}">
              <button class="btn btn-sm btn-ghost" type="submit">취소</button>
            </form>
            <div th:if="${bonus.canceled}">
              <span class="badge badge-ghost badge-sm">취소됨</span>
              <div class="muted mono" th:text="${bonus.canceledByAdminId}">관리자 ID</div>
              <div class="muted mono" th:if="${bonus.canceledAt != null}"
                   th:text="${#temporals.format(bonus.canceledAt, 'yyyy-MM-dd HH:mm:ss', 'Asia/Seoul')}">2026-10-20 12:00:00</div>
            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(bonuses)}">
          <td class="muted" colspan="5">부여 이력이 없습니다.</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
</body>
</html>
