<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 최근 부여된(취소되지 않은) 보너스 5건. 컨텍스트 변수 dashboard -->
<section class="panel" th:fragment="dashboard-recent-bonuses">
  <div class="panel-head">
    <h2>최근 보너스</h2>
  </div>
  <div class="table-wrap">
    <table class="table table-sm">
      <thead>
        <tr>
          <th>적용일</th>
          <th>추가 시간</th>
          <th>사유</th>
          <th>부여 시각</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="bonus : ${dashboard.recentBonuses}">
          <td th:text="${#temporals.format(bonus.bonusDate, 'yyyy-MM-dd')}">-</td>
          <td th:text="|+${#numbers.formatInteger(bonus.seconds, 1, 'COMMA')}초|">+0초</td>
          <td class="dashboard-free-text-preview" th:text="${bonus.reason}">-</td>
          <td class="muted" th:text="${#temporals.format(bonus.grantedAt, 'yyyy-MM-dd HH:mm:ss', 'Asia/Seoul')}">-</td>
        </tr>
        <tr th:if="${#lists.isEmpty(dashboard.recentBonuses)}">
          <td class="muted" colspan="4">아직 부여한 보너스가 없습니다.</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
</body>
</html>
