<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!--
  회원 삭제 버튼. SUPER_ADMIN에게만 렌더링한다(요청 자체도 보안 설정이 막는다).
  삭제는 htmx 없이 일반 폼 POST이며 CSRF 숨은 필드는 th:action이 넣는다. 확인은 공통 확인 모달(data-confirm-*)이 맡는다.
  컨텍스트 변수 member
-->
<div th:fragment="member-delete-modal" sec:authorize="hasRole('SUPER_ADMIN')">
  <form method="post" th:action="@{/admin/members/{memberId}/delete(memberId=${member.id})}"
        data-confirm-title="회원을 삭제할까요?" th:data-confirm-subject="${member.nickname}"
        data-confirm-message="삭제하면 이 회원의 통화 기록, 통화 보너스, 피드백, 온보딩 응답, AI 캐릭터, 프로필 사진 기록 등 연관 데이터가 함께 삭제되며 되돌릴 수 없습니다.">
    <button class="btn btn-sm btn-error" type="submit">회원 삭제</button>
  </form>
</div>
</body>
</html>
