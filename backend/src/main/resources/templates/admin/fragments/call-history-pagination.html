<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 통화 목록 이전/다음 페이지 이동. 링크는 필터를 유지한다. 컨텍스트 변수 callCurrentPageNumber, callTotalPages, callPreviousPageUrl, callNextPageUrl, callResult -->
<nav class="member-pagination" aria-label="통화 기록 페이지 이동" th:fragment="call-history-pagination">
  <a th:if="${callPreviousPageUrl != null}" class="btn btn-sm btn-ghost" th:href="@{${callPreviousPageUrl}}">이전</a>
  <span class="muted" th:text="|${callCurrentPageNumber} / ${callTotalPages}|">1 / 1</span>
  <a th:if="${callNextPageUrl != null}" class="btn btn-sm btn-ghost" th:href="@{${callNextPageUrl}}">다음</a>
  <span class="muted">총 <span th:text="${#numbers.formatInteger(callResult.totalElements, 1, 'COMMA')}">0</span>건</span>
</nav>
</body>
</html>
