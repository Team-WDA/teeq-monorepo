<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 회원 목록 표. 컨텍스트 변수 result -->
<section class="panel" th:fragment="member-table">
  <div class="table-wrap">
    <table class="table member-table">
      <thead>
        <tr>
          <th>닉네임</th>
          <th>이메일</th>
          <th>로그인 방식</th>
          <th>가입일</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="member : ${result.members}">
          <td>
            <a class="link link-primary" th:href="@{/admin/members/{memberId}(memberId=${member.id})}">
              <span th:text="${member.nickname}">닉네임</span>
            </a>
          </td>
          <td th:text="${member.email}">user@example.com</td>
          <td th:text="${member.loginType}">APPLE</td>
          <td class="mono" th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm:ss', 'Asia/Seoul')}">2026-10-20 12:00:00</td>
        </tr>
        <tr th:if="${#lists.isEmpty(result.members)}">
          <td class="muted" colspan="4">회원이 없습니다.</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
</body>
</html>
