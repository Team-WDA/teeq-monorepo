<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 홈 KPI 카드 6개. 주간 재통화 회원(North Star)을 강조한다. 컨텍스트 변수 dashboard -->
<section class="dashboard-kpi-grid" aria-label="핵심 지표" th:fragment="dashboard-kpi-cards">
  <article class="dashboard-kpi-card dashboard-kpi-card-highlight">
    <h2 class="dashboard-kpi-label">주간 재통화 회원 <span class="muted">(North Star)</span></h2>
    <p class="dashboard-kpi-value" th:text="${#numbers.formatInteger(dashboard.weeklyReturningMembers, 1, 'COMMA')}">0</p>
    <p class="dashboard-kpi-caption">최근 7일(오늘 포함) 2회 이상 통화한 회원</p>
  </article>
  <article class="dashboard-kpi-card">
    <h2 class="dashboard-kpi-label">총 회원</h2>
    <p class="dashboard-kpi-value" th:text="${#numbers.formatInteger(dashboard.totalMembers, 1, 'COMMA')}">0</p>
    <p class="dashboard-kpi-caption">
      오늘 가입 <span th:text="${#numbers.formatInteger(dashboard.todayJoinedMembers, 1, 'COMMA')}">0</span>명 ·
      가입 완료 여부와 무관
    </p>
  </article>
  <article class="dashboard-kpi-card">
    <h2 class="dashboard-kpi-label">오늘 통화</h2>
    <p class="dashboard-kpi-value" th:text="|${#numbers.formatInteger(dashboard.todayCallCount, 1, 'COMMA')}회|">0회</p>
    <p class="dashboard-kpi-caption" th:text="|총 ${#numbers.formatInteger(dashboard.todayCallSeconds, 1, 'COMMA')}초|">총 0초</p>
  </article>
  <article class="dashboard-kpi-card">
    <h2 class="dashboard-kpi-label">온보딩 완료율</h2>
    <p class="dashboard-kpi-value" th:text="|${dashboard.onboardingCompletionPercent()}%|">0%</p>
    <p class="dashboard-kpi-caption">가입 완료(닉네임 있음) 회원 중 활성 온보딩 제출이 있는 비율</p>
  </article>
  <article class="dashboard-kpi-card">
    <h2 class="dashboard-kpi-label">최근 7일 피드백</h2>
    <p class="dashboard-kpi-value" th:text="${#numbers.formatInteger(dashboard.recentFeedbackTotalCount(), 1, 'COMMA')}">0</p>
    <p class="dashboard-kpi-caption"
       th:text="|필수 ${#numbers.formatInteger(dashboard.recentFeedbackRequiredCount, 1, 'COMMA')} · 상세 ${#numbers.formatInteger(dashboard.recentFeedbackDetailedCount, 1, 'COMMA')}|">필수 0 · 상세 0</p>
  </article>
  <article class="dashboard-kpi-card">
    <h2 class="dashboard-kpi-label">이번 달 부여 보너스</h2>
    <p class="dashboard-kpi-value" th:text="|${#numbers.formatInteger(dashboard.monthBonusCount, 1, 'COMMA')}건|">0건</p>
    <p class="dashboard-kpi-caption" th:text="|합계 ${#numbers.formatInteger(dashboard.monthBonusSeconds, 1, 'COMMA')}초 · 취소 제외 · 유효 날짜 기준|">합계 0초</p>
  </article>
</section>
</body>
</html>
