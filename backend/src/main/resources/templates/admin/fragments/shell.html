<!doctype html>
<!--
  관리자 화면 공통 셸. 화면은 <html th:replace="~{admin/fragments/shell :: shell('제목', ~{::main}, '메뉴키')}">로 조립한다.
  title: 브라우저 탭과 상단 바에 보이는 화면 이름
  content: 화면 본문(<main class="content">)
  active: 강조할 메뉴 키(home, settings, members, calls, feedbacks, ai-server, onboarding-submissions, bug-reports,
          accounts). 해당 없음이면 ''
-->
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org" th:fragment="shell(title, content, active)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf?.token}">
  <meta name="_csrf_header" th:content="${_csrf?.headerName}">
  <title th:text="|${title} - teeq 관리자|">teeq 관리자</title>
  <link th:replace="~{admin/fragments/favicon :: favicon}">
  <link rel="stylesheet" th:href="@{/admin/assets/daisyui.min.css}">
  <link rel="stylesheet" th:href="@{/admin/assets/themes.css}">
  <link rel="stylesheet" th:href="@{/admin/assets/admin.css}">
  <script th:src="@{/admin/assets/htmx.min.js}"></script>
  <script>
    // htmx 요청에 meta 태그의 CSRF 토큰을 헤더로 싣는다
    document.addEventListener('htmx:configRequest', function (event) {
      var token = document.querySelector('meta[name="_csrf"]');
      var header = document.querySelector('meta[name="_csrf_header"]');
      if (token && header && token.content && header.content) {
        event.detail.headers[header.content] = token.content;
      }
    });
    // 422는 입력 오류를 담은 조각이므로 오류로 보지 않고 원래 대상에 바꿔 끼운다.
    // HX-Retarget이 있는 오류 응답은 관리자 화면 오류 처리기가 보낸 한 줄 오류 조각이므로 알림 영역에 끼우고 알림을 보인다
    document.addEventListener('htmx:beforeSwap', function (event) {
      var xhr = event.detail.xhr;
      if (xhr.status === 422) {
        event.detail.shouldSwap = true;
        event.detail.isError = false;
        return;
      }
      if (xhr.status >= 400 && xhr.getResponseHeader('HX-Retarget')) {
        event.detail.shouldSwap = true;
        event.detail.isError = false;
        document.getElementById('htmx-error-notice').hidden = false;
      }
    });
    // 끼워 넣지 못한 실패(처리기를 거치지 않은 오류, 네트워크 오류)는 응답 본문 대신 고정 문구만 보인다
    function showDefaultHtmxErrorNotice() {
      var notice = document.getElementById('htmx-error-notice');
      notice.textContent = notice.dataset.defaultMessage;
      notice.hidden = false;
    }
    document.addEventListener('htmx:responseError', showDefaultHtmxErrorNotice);
    document.addEventListener('htmx:sendError', showDefaultHtmxErrorNotice);
    document.addEventListener('htmx:beforeRequest', function () {
      document.getElementById('htmx-error-notice').hidden = true;
    });

    // 확인 모달. form 또는 button에 data-confirm-title(필수), data-confirm-subject·data-confirm-message(선택)를 달면
    // 요청 전에 모달을 띄우고 확인했을 때만 보낸다. data-confirm-label이 달린 입력은 "라벨: 이전값 → 새값"으로 나열한다
    var pendingConfirmAction = null;

    // 확인 모달 설정이 달린 요소를 찾는다. 요소 자신이 없으면 제출 버튼을 본다
    function findConfirmSource(element, submitter) {
      if (element && element.hasAttribute('data-confirm-title')) {
        return element;
      }
      if (submitter && submitter.hasAttribute('data-confirm-title')) {
        return submitter;
      }
      return null;
    }

    function confirmFieldValue(field) {
      if (field.tagName === 'SELECT') {
        return field.selectedIndex >= 0 ? field.options[field.selectedIndex].text : '';
      }
      return field.value;
    }

    // 이전값: data-confirm-previous가 있으면 그 값, 없으면 input·textarea는 defaultValue, select는 기본 선택 옵션의 텍스트
    function confirmFieldPreviousValue(field) {
      if (field.hasAttribute('data-confirm-previous')) {
        return field.getAttribute('data-confirm-previous');
      }
      if (field.tagName !== 'SELECT') {
        return field.defaultValue;
      }
      var defaultOption = Array.prototype.find.call(field.options, function (option) {
        return option.defaultSelected;
      });
      return defaultOption ? defaultOption.text : null;
    }

    function describeConfirmField(field) {
      var label = field.getAttribute('data-confirm-label');
      var value = confirmFieldValue(field);
      var previousValue = confirmFieldPreviousValue(field);
      // 이전값이 비어 있으면(새로 입력하는 칸) 화살표 없이 새값만 보인다
      if (previousValue && previousValue !== value) {
        return label + ': ' + previousValue + ' → ' + value;
      }
      return label + ': ' + value;
    }

    function setOptionalConfirmText(element, text) {
      element.textContent = text || '';
      element.hidden = !text;
    }

    // source의 data-confirm-*로 모달을 채워 열고, 확인하면 onConfirm을 부른다. 폼 검증에 실패하면 모달을 열지 않는다
    // 폼 안의 type="button" 버튼(자체 hx-post를 가진 되돌리기 등)은 폼 입력을 보내는 동작이 아니므로
    // 폼 검증과 입력 나열을 하지 않고 제목·대상·안내 문구만 보인다
    function confirmDialog(source, onConfirm) {
      var form = source.tagName === 'FORM' ? source : (source.type === 'submit' ? source.closest('form') : null);
      if (form && !form.checkValidity()) {
        form.reportValidity();
        return;
      }
      var dialog = document.getElementById('confirm-dialog');
      dialog.querySelector('.confirm-dialog-title').textContent = source.getAttribute('data-confirm-title');
      setOptionalConfirmText(dialog.querySelector('.confirm-dialog-subject'),
        source.getAttribute('data-confirm-subject'));
      setOptionalConfirmText(dialog.querySelector('.confirm-dialog-message'),
        source.getAttribute('data-confirm-message'));
      var changeList = dialog.querySelector('.confirm-dialog-changes');
      changeList.replaceChildren();
      (form || source).querySelectorAll('[data-confirm-label]').forEach(function (field) {
        var item = document.createElement('li');
        item.textContent = describeConfirmField(field);
        changeList.appendChild(item);
      });
      changeList.hidden = changeList.children.length === 0;
      pendingConfirmAction = onConfirm;
      dialog.showModal();
    }

    // htmx 요청(폼·버튼)은 htmx:confirm에서 멈추고, 확인하면 확인 단계를 건너뛰고 보낸다
    document.addEventListener('htmx:confirm', function (event) {
      var triggeringEvent = event.detail.triggeringEvent;
      var source = findConfirmSource(event.detail.elt, triggeringEvent && triggeringEvent.submitter);
      if (!source) {
        return;
      }
      event.preventDefault();
      confirmDialog(source, function () {
        event.detail.issueRequest(true);
      });
    });
    // 일반 폼 제출. hx-post가 있는 폼은 htmx:confirm에서 처리하므로 건너뛴다(이중 가로채기 방지)
    document.addEventListener('submit', function (event) {
      var form = event.target;
      if (form.closest('[hx-post]')) {
        return;
      }
      var source = findConfirmSource(form, event.submitter);
      if (!source) {
        return;
      }
      event.preventDefault();
      confirmDialog(source, function () {
        form.submit();
      });
    });
    document.addEventListener('click', function (event) {
      if (!event.target.closest('#confirm-dialog-accept')) {
        return;
      }
      var action = pendingConfirmAction;
      pendingConfirmAction = null;
      document.getElementById('confirm-dialog').close();
      if (action) {
        action();
      }
    });
  </script>
</head>
<body>
  <div class="shell">
    <nav th:replace="~{admin/fragments/sidebar-navigation :: sidebar-navigation(${active})}"></nav>
    <div class="shell-main">
      <header th:replace="~{admin/fragments/top-bar :: top-bar(${title})}"></header>
      <!-- htmx 오류 알림. 오류 처리기의 한 줄 오류 조각(HX-Retarget)이 여기에 들어오고, 그 밖의 실패는 data-default-message를 보인다 -->
      <div id="htmx-error-notice" class="htmx-error-notice" role="alert" hidden
           data-default-message="요청을 처리하지 못했습니다. 페이지를 새로고침한 뒤 다시 시도하세요.">
        요청을 처리하지 못했습니다. 페이지를 새로고침한 뒤 다시 시도하세요.
      </div>
      <main th:replace="${content}">
        <p>본문</p>
      </main>
    </div>
  </div>
  <!-- 공통 확인 모달. 내용은 confirmDialog가 data-confirm-* 값으로 채운다 -->
  <dialog id="confirm-dialog" class="modal" aria-labelledby="confirm-dialog-title">
    <div class="modal-box">
      <h3 id="confirm-dialog-title" class="confirm-dialog-title">확인</h3>
      <p class="confirm-dialog-subject" hidden></p>
      <p class="confirm-dialog-message muted" hidden></p>
      <ul class="confirm-dialog-changes" hidden></ul>
      <div class="modal-action">
        <form method="dialog">
          <button class="btn btn-sm btn-ghost" type="submit">취소</button>
        </form>
        <button id="confirm-dialog-accept" class="btn btn-sm btn-primary" type="button">확인</button>
      </div>
    </div>
  </dialog>
</body>
</html>
