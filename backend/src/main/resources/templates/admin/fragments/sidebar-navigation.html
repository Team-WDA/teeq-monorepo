<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- 왼쪽 어두운 사이드바 메뉴. activeMenu와 같은 키의 메뉴를 강조한다 -->
<nav class="sidebar" aria-label="관리자 메뉴" th:fragment="sidebar-navigation(activeMenu)">
  <div class="brand">teeq <span class="brand-accent">admin</span><small>운영자 전용</small></div>
  <a th:href="@{/admin}" th:classappend="${activeMenu == 'home'} ? 'active'"
     th:attr="aria-current=${activeMenu == 'home'} ? 'page'">대시보드</a>
  <a th:href="@{/admin/settings}" th:classappend="${activeMenu == 'settings'} ? 'active'"
     th:attr="aria-current=${activeMenu == 'settings'} ? 'page'">서비스 설정</a>
  <a th:href="@{/admin/call-usages}" th:classappend="${activeMenu == 'call-usages'} ? 'active'"
     th:attr="aria-current=${activeMenu == 'call-usages'} ? 'page'">통화 사용량</a>
  <a th:href="@{/admin/members}" th:classappend="${activeMenu == 'members'} ? 'active'"
     th:attr="aria-current=${activeMenu == 'members'} ? 'page'">회원 관리</a>
  <a th:href="@{/admin/onboarding-submissions}" th:classappend="${activeMenu == 'onboarding-submissions'} ? 'active'"
     th:attr="aria-current=${activeMenu == 'onboarding-submissions'} ? 'page'">온보딩 응답 이력</a>
  <a th:href="@{/admin/bug-reports}" th:classappend="${activeMenu == 'bug-reports'} ? 'active'"
     th:attr="aria-current=${activeMenu == 'bug-reports'} ? 'page'">버그 제보</a>
  <a th:href="@{/admin/accounts}" th:classappend="${activeMenu == 'accounts'} ? 'active'"
     th:attr="aria-current=${activeMenu == 'accounts'} ? 'page'" sec:authorize="hasRole('SUPER_ADMIN')">관리자 계정</a>
</nav>
</body>
</html>
